name: RAEHAN BOT INFINITE

on:
  push:
    branches: [ Grak ]
  workflow_dispatch: # Tombol manual

jobs:
  ultra-runner:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Running Bot & Auto-Restart
        timeout-minutes: 335 # Berhenti di 5 jam 35 menit
        continue-on-error: true
        run: |
          # Loop internal agar jika bot crash karena koneksi, dia restart sendiri
          while true; do
            echo "Starting Bot..."
            npm start
            echo "Bot crashed! Restarting in 1 seconds..."
            sleep 1
          done

      - name: Deep Clean & Self-Trigger (Anti Jejak)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 1. Hapus SEMUA riwayat workflow yang sudah selesai (Membersihkan jejak sampah)
          echo "Cleaning up all logs and history..."
          gh run list --limit 100 --status completed --json databaseId | jq -r '.[] | .databaseId' | xargs -I {} gh run delete {} || echo "Clean!"
          gh run list --limit 100 --status cancelled --json databaseId | jq -r '.[] | .databaseId' | xargs -I {} gh run delete {} || echo "Clean!"

          # 2. Memicu workflow baru (Estafet Otomatis)
          echo "Starting new session..."
          gh workflow run "RAEHAN BOT INFINITE" --ref Grak
