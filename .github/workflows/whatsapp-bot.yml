name: WhatsApp Bot 1-Hour Stable

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Berjalan otomatis setiap menit ke-0 tiap jam

# KUNCI ANTI-ERROR: Mematikan workflow lama saat workflow baru jalan
concurrency:
  group: wa-bot-group
  cancel-in-progress: true 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Memberi waktu maksimal 1 jam (lebih sedikit untuk persiapan restart)
    timeout-minutes: 60 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install -g pm2
          # sudo apt-get install -y ffmpeg # Buka jika bot butuh fitur stiker

      - name: Run WhatsApp Bot
        env:
          # Pastikan variabel ini sudah ada di Settings > Secrets > Actions
          SESSION_DATA: ${{ secrets.SESSION_DATA }} 
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Memulai Bot WhatsApp..."
          while true;do
pm2 link 5z3ehqcmidy5g80 2cqdvbfiq3chpsz && pm2 start index.js && pm2 save && pm2 logs
          # Loop internal: Jika bot crash di tengah jam, dia akan menyambung lagi secara otomatis
          # Loop ini akan berhenti total ketika GitHub mematikan job (setiap jam)
          until pm2 restart index.js; do
            echo "Bot crash (Error Code $?). Me-restart dalam 1 detik..."
            sleep 1
          done
