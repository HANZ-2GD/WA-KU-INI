name: WhatsApp Bot Runner

on:
  workflow_dispatch: # Memungkinkan kamu menjalankan bot secara manual
  schedule:
    - cron: '0 * * * *' # Otomatis restart setiap 6 jam (untuk menghindari limit GitHub)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Sesuaikan dengan versi Node.js kamu
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install -g pm2
          # Jika bot kamu butuh ffmpeg untuk stiker, tambahkan baris di bawah:
          # sudo apt-get install -y ffmpeg

      - name: Run WhatsApp Bot
        env:
          # Masukkan environment variables di GitHub Secrets (Settings > Secrets)
          SESSION_DATA: ${{ secrets.SESSION_DATA }} 
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Memulai Bot..."
          # Perintah di bawah akan mencoba menjalankan bot terus-menerus
          # Jika crash, script akan menunggu 5 detik lalu mulai lagi
          while true; do
            pm2 link 5z3ehqcmidy5g80 2cqdvbfiq3chpsz && pm2 start index.js && pm2 save && pm2 logs
            echo "Bot terdeteksi mati/crash. Me-restart dalam 1 detik..."
            sleep 1
          done
