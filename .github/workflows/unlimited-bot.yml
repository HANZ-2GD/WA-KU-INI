name: RAEHAN BOT INFINITE LOOP

on:
  push:
    branches: [ Grak ]
  workflow_dispatch: # Memungkinkan eksekusi manual

jobs:
  bot-runner:
    runs-on: ubuntu-latest
    
    # Memberikan izin agar script bisa memodifikasi dan menjalankan actions
    permissions:
      actions: write
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Packages
        run: npm install

      - name: Jalankan RAEHAN BOT (Max 5.5 Jam)
        # GitHub punya batas keras 360 menit. Kita hentikan di 330 menit 
        # agar ada waktu untuk menjalankan script estafet di bawahnya.
        timeout-minutes: 330
        continue-on-error: true
        run: |
          # Loop penjaga: Jika index.js error/crash, bot langsung restart otomatis
          while true; do
            echo "Menjalankan bot..."
            node index.js
            echo "Bot terhenti, mencoba restart otomatis dalam 1 detik..."
            sleep 1
          done

      - name: Menghapus Riwayat Workflow Lama (Bypass Limit)
        if: always() # Pastikan ini selalu jalan meskipun bot error atau timeout
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Membersihkan log workflow lama..."
          # Mengambil daftar ID run yang sudah selesai dan menghapusnya
          # Tambahan '|| true' agar script tidak error jika tidak ada log yang bisa dihapus
          gh run list --limit 15 --status completed --json databaseId -q '.[].databaseId' | xargs -I {} gh run delete {} || true

      - name: Membuat Workflow Baru (Estafet Otomatis)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Memicu sesi baru secara otomatis..."
          # Memanggil workflow ini kembali secara otomatis
          gh workflow run "RAEHAN BOT INFINITE LOOP" --ref Grak
