name: RAEHAN BOT AUTO RUNNER

on:
  push:
    branches: [ Grak ]
  workflow_dispatch: # Tombol pemicu manual

jobs:
  unlimited-runner:
    runs-on: ubuntu-latest
    
    # Izin penuh untuk membaca dan menghapus log Actions
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Running RAEHAN BOT
        # Limit waktu diatur ke 335 menit (5,5 jam) agar tidak terkena hard-limit 6 jam GitHub
        timeout-minutes: 335
        continue-on-error: true
        run: |
          # Perulangan otomatis jika index.js tiba-tiba error/mati
          while true; do
            echo "Memulai RAEHAN BOT..."
            npm start
            echo "Bot terhenti! Mencoba restart otomatis dalam 1 detik..."
            sleep 1
          done

      - name: Auto Delete Centang Hijau & Sampah (Zero Trace)
        if: always() # Pastikan selalu dieksekusi di akhir
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Membersihkan riwayat log agar tidak meninggalkan jejak..."
          
          # 1. Menghapus riwayat "Centang Hijau" (Completed/Sukses)
          gh run list --status completed --json databaseId -q '.[].databaseId' | xargs -I {} gh run delete {} || true
          
          # 2. Menghapus riwayat yang Dibatalkan (Cancelled)
          gh run list --status cancelled --json databaseId -q '.[].databaseId' | xargs -I {} gh run delete {} || true
          
          # 3. Menghapus riwayat yang Error/Terkena Limit (Failure)
          gh run list --status failure --json databaseId -q '.[].databaseId' | xargs -I {} gh run delete {} || true

      - name: Membuat Workflow Baru (Estafet Otomatis)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Memicu eksekusi sesi baru secara otomatis..."
          # Memanggil nama workflow ini dari awal
          gh workflow run "RAEHAN BOT AUTO RUNNER" --ref Grak
